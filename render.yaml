# One-click deploy config for Render (https://render.com).
# Render reads this file and creates a free Node web service automatically.
services:
  - type: web
    name: listening-lab-media-release
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Destination Google Drive folder (the Listening Lab folder).
      - key: GDRIVE_FOLDER_ID
        value: 1YjuH6TGdtpZ0MIZChItaBRLKOMaY8RFE
      # Google OAuth credentials — set these in the Render dashboard (kept secret).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
